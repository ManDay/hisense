name: Android CI

on:
  workflow_dispatch:
    inputs:
      buildtype:
        description: 'Buildtype (debug, release)'
        default: 'debug'
        required: true
  #push:
   # branches: [ "main" ]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Prepare Default Environment
      if: ${{ github.event.inputs.buildtype != 'release' }}
      run: | 
        echo "BUILD_TYPE_MC=Debug" >>$GITHUB_ENV
        echo "BUILD_TYPE_LC=debug" >>$GITHUB_ENV
    - name: Prepare Release Environment
      if: ${{ github.event.inputs.buildtype == 'release' }}
      run: | 
        echo "BUILD_TYPE_MC=Release" >>$GITHUB_ENV
        echo "BUILD_TYPE_LC=release" >>$GITHUB_ENV
    - name: Checkout
      uses: actions/checkout@v6.0.2
    - name: Setup Java
      uses: actions/setup-java@v5.1.0
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Setup apksigner
      run: |
        echo "$ANDROID_SDK_ROOT/build-tools/37.0.0" >> $GITHUB_PATH  
    - name: Download keys
      run: |
        curl -L https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/platform.pk8?format=TEXT | base64 -d > platform.pk8 
        curl -L https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/platform.x509.pem?format=TEXT | base64 -d > platform.x509.pem 
    - name: Pack keys
      run: |
        openssl pkcs8 -inform DER -nocrypt -in platform.pk8 -out platform.key
        openssl pkcs12 -export -in platform.x509.pem -inkey platform.key -out platform.p12 -name testkey -password pass:android
    - name: Run Gradle
      run: gradle --warning-mode=all assemble${{ env.BUILD_TYPE_MC }} --debug
    - name: Sign APK
      run: apksigner sign --ks platform.p12 --ks-type PKCS12 --ks-key-alias testkey --ks-pass pass:android --out hisense-signed.apk build/outputs/apk/debug/hisense-${{ env.BUILD_TYPE_LC }}.apk
    - name: Diagnoze APK
      run: find "$ANDROID_SDK_ROOT"
    - name: Upload APK
      uses: actions/upload-artifact@v6.0.0
      with:
        name: hisense.apk
        path: hisense-signed.apk
