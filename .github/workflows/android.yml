name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5.1.0
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Run Gradle
      run: gradle --warning-mode=all assembleDebug
