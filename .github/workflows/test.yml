name: Test

on: [workflow_dispatch]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Prepare Default Environment
      run: | 
        echo "BUILD_TYPE_MC=Debug" >>$GITHUB_ENV
        echo "BUILD_TYPE_LC=debug" >>$GITHUB_ENV
    - name: Checkout
      uses: actions/checkout@v6.0.2
    - name: Setup Java
      uses: actions/setup-java@v5.1.0
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Checks
      run: find "$ANDROID_SDK_ROOT"
    - name: Setup apksigner
      run: |
        echo "$ANDROID_SDK_ROOT/build-tools/37.0.0" >> $GITHUB_PATH
    - name: Download keys
      run: |
        curl -L https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT | base64 -d > testkey.pk8 
        curl -L https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT | base64 -d > testkey.x509.pem 
    - name: Pack keys
      run: |
        openssl pkcs8 -inform DER -nocrypt -in testkey.pk8 -out testkey.key
        openssl pkcs12 -export -in testkey.x509.pem -inkey testkey.key -out testkey.p12 -name androiddebugkey -password pass:android
        ls -l testkey.p12
    - name: Test
      run: echo "$PATH"; apksigner
